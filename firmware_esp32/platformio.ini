[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

lib_deps =
    https://github.com/micro-ROS/micro_ros_arduino.git#v2.0.7-humble
    madhephaestus/ESP32Servo @ ^3.0.5

build_flags =
    -L .pio/libdeps/esp32dev/micro_ros_arduino/src/esp32/
    -l microros